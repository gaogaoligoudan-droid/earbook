# EarBook CI：防坑六件套（Phase 0 实测通过版）+ instrumented smoke tests
# 配置参照 android-emulator-probe run#1（1m36s success, 2026-10-05）
name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 挂起兜底（#478 形态）

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # 模型走 git-lfs（assets/model.tar.bz2），缺了会拿到指针文件→APK 无模型

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # 2-vCPU runner 启用 KVM（GitHub 官方 2024-04 changelog 步骤）
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # pin SHA（防 tag 漂移）；pachli 防坑参数：api 31 + default 镜像 + force-avd-creation false + -no-metrics
      # -memory 3072：SherpaE2eTest 加载 kokoro int8 模型（~1GB 进程内存），2GB 会 OOM
      - name: Run instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: |
            # SherpaE2eTest 从 APK 内置 assets 解包模型（0.2.0 起不再联网下载）
            ./gradlew connectedDebugAndroidTest --stacktrace
            # 提取 RTF 基准数据到 summary
            adb logcat -d -s SherpaE2E:I | tee sherpa-benchmark.log || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            sherpa-benchmark.log
          if-no-files-found: ignore
